# CSP فقط برای صفحهٔ /s/ روی r1.onyxour.com
#
# چرا جدا از security-headers.conf: این CSP برای همین یک فایل استاتیک نوشته
# شده که محتوایش را می‌شناسیم. رویِ onyxour.com اعمالش نکنید — آن سایت یک
# SPA از no-code builder است که React را در مرورگر ترنسپایل می‌کند و تقریباً
# قطعاً به 'unsafe-eval' نیاز دارد؛ آنجا اول Report-Only (پایین) بگذارید.
#
# نصب: داخل location ای که /s/ را سرو می‌کند:
#   include snippets/security-headers.conf;
#   include snippets/csp-subscription.conf;
#
# 'unsafe-inline' لازم است: qrcodejs و منطق صفحه هر دو inline اند.
# connect-src 'self' کافی است چون fetch به /sub/{token}/info روی همین origin است.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

# --- برای onyxour.com: اول این را بگذارید، چند روز console/report را ببینید،
#     بعد تصمیم بگیرید. Report-Only هیچ چیزی را نمی‌شکند.
# add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:" always;
