# Security headers — از اسکن ۲۰۲۶-۰۸-۱۳ (هر دو هاست صفر هدر داشتند)
#
# نصب:
#   scp این فایل → /etc/nginx/snippets/security-headers.conf   (روی VPS1)
#   بعد داخل هر server block:   include snippets/security-headers.conf;
#   و در http block:            server_tokens off;
#   سپس: nginx -t && systemctl reload nginx
#
# نکته add_header: اگر یک block فرزند add_header خودش را داشته باشد، همهٔ
# هدرهای والد را دور می‌ریزد. پس این include باید داخل هر server/location‌ای
# که add_header دارد تکرار شود.

add_header X-Content-Type-Options    "nosniff"        always;
add_header Referrer-Policy           "no-referrer"    always;
add_header X-Frame-Options           "DENY"           always;
add_header Cross-Origin-Opener-Policy "same-origin"   always;

# HSTS — بدون includeSubDomains و بدون preload به‌عمد.
# includeSubDomains همهٔ ساب‌دامین‌ها (از جمله نودهای آینده) را در مرورگر
# به HTTPS پین می‌کند و تا انقضای max-age برگشت‌پذیر نیست. اگر مطمئن شدید
# همهٔ ساب‌دامین‌ها TLS دارند، اول max-age را کم بگذارید و بعد بالا ببرید.
add_header Strict-Transport-Security "max-age=31536000" always;
